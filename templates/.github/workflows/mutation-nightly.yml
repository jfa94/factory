name: Mutation Full (Manual)

on:
  workflow_dispatch:

concurrency:
  group: mutation-full
  cancel-in-progress: true

# MANAGED by the factory from .factory/gates.json. This explicitly dispatched,
# off-critical-path workflow tracks the full mutable surface on `develop`.
# Each stable-hash shard restores its newest completed incremental snapshot,
# processes files sequentially in chunks, and publishes partial progress under
# a unique checked-out-SHA/run key. Pull-request mutation remains cold and hunk
# scoped, so its threshold verdict never depends on this cache history.
jobs:
  mutation-scope:
    name: Mutation Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.scope.outputs.shards }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: __FACTORY_BASE_BRANCH__
      - name: Compute and shard full mutable surface
        id: scope
        run: |
          shards_json=$(node .github/scripts/shard-mutation-scope.mjs full __MUTATION_ROOTS__)
          any=$(jq -r 'any(.[]; length > 0)' <<< "$shards_json")
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "shards=$shards_json" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: mutation-scope
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Shard slice
        id: slice
        env:
          SHARDS_JSON: ${{ needs.mutation-scope.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          slice=$(jq -r --argjson i $((SHARD - 1)) '.[$i]' <<< "$SHARDS_JSON")
          echo "slice=$slice" >> "$GITHUB_OUTPUT"
      - name: Skip when no scope
        if: needs.mutation-scope.outputs.any != 'true' || steps.slice.outputs.slice == ''
        run: 'echo "Shard ${{ matrix.shard }}: no files; skipping."'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.slice.outputs.slice != ''
        with:
          ref: __FACTORY_BASE_BRANCH__
      - name: Record checked-out develop SHA
        id: source
        if: steps.slice.outputs.slice != ''
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # factory:mutation-setup
      - name: Restore Stryker incremental cache (shard ${{ matrix.shard }})
        if: steps.slice.outputs.slice != ''
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: reports/mutation/.stryker-incremental-shard-${{ matrix.shard }}.json
          key: ${{ runner.os }}-stryker-shard-${{ matrix.shard }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-stryker-shard-${{ matrix.shard }}-
      - name: Run Stryker sequentially on shard ${{ matrix.shard }}
        if: steps.slice.outputs.slice != ''
        env:
          SLICE: ${{ steps.slice.outputs.slice }}
          pnpm_config_verify_deps_before_run: "false" # Stryker's sandbox symlinks node_modules; stop pnpm reinstalling there
          INC: reports/mutation/.stryker-incremental-shard-${{ matrix.shard }}.json
          CHUNK: 8
          CAP_MIN: 330
        run: |
          # One writer reuses one incremental file. Every dispatch runs at least
          # one chunk; the soft cap leaves time for cache/artifact publication.
          IFS=',' read -ra FILES <<< "$SLICE"
          SECONDS=0
          rc=0 last=0 i=0
          for ((i = 0; i < ${#FILES[@]}; i += CHUNK)); do
            if [ "$i" -gt 0 ] && [ $(( SECONDS + last * 3 / 2 )) -ge $(( CAP_MIN * 60 )) ]; then
              echo "::warning::shard ${{ matrix.shard }}: soft cap reached; $(( ${#FILES[@]} - i )) file(s) deferred"
              break
            fi
            t0=$SECONDS
            chunk=$(IFS=,; echo "${FILES[*]:i:CHUNK}")
            pnpm exec stryker run --mutate "$chunk" --incrementalFile "$INC" || rc=$?
            last=$(( SECONDS - t0 ))
          done
          [ "$i" -ge "${#FILES[@]}" ] && echo "shard ${{ matrix.shard }}: full slice complete"
          exit "$rc"
      - name: Save partial Stryker progress (shard ${{ matrix.shard }})
        if: always() && steps.slice.outputs.slice != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: reports/mutation/.stryker-incremental-shard-${{ matrix.shard }}.json
          key: ${{ runner.os }}-stryker-shard-${{ matrix.shard }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload shard report
        if: always() && steps.slice.outputs.slice != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 7
